name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (optional, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release OmniTrack APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag
        id: release_info
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.0.0-b${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.0-b${{ github.run_number }} --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
          cat <<EOF > release-output/version.json
          {
            "version": "${{ steps.release_info.outputs.tag }}",
            "versionCode": ${{ github.run_number }},
            "apkUrl": "https://github.com/ExZyO/OmniTrack/releases/download/${{ steps.release_info.outputs.tag }}/OmniTrack-${{ steps.release_info.outputs.tag }}.apk",
            "releaseNotes": "OmniTrack ${{ steps.release_info.outputs.tag }}: Fixed in-place update signature, dynamic build versioning, lossless cover loader, multi-source category waterfall, seamless ambient glow, adaptive grid, and interactive search."
          }
          EOF
          cp release-output/version.json version.json

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTrack-${{ steps.release_info.outputs.tag }}
          path: release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: OmniTrack ${{ steps.release_info.outputs.tag }}
          files: |
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
            release-output/version.json
          body: |
            ## 📱 OmniTrack Release (${{ steps.release_info.outputs.tag }})

            ### ✨ What's in this build (Non-Technical Summary)
            - **In-App Auto-Update Engine:** Seamless background version checking ported from Gemini EPUB & Chimanew. Whenever an update drops, a one-tap update prompt appears — tapping it downloads and launches the Android installer automatically, zero manual GitHub downloading needed!
            - **Unboxed Nuvio Noir Progress Controls:** Removed all boxed containers and chunky cards around episode/chapter trackers. Large floating numbers roll vertically with mechanical spring animations directly on the AMOLED canvas.
            - **Seamless Movie & Game Controls:** Unboxed clean checkmark toggle for movies and floating playtime counters for games with platform pills.
            - **Chimanew Cover Waterfall:** Multi-source cover discovery (MangaDex, AniList, Bangumi) with lossless uncompressed artwork.

            ### 🔧 Technical Details
            - **Commit:** ${{ github.sha }}
            - **Build Type:** Release (`assembleRelease` with signingConfig)
            - **Update System:** Concurrent multi-source query (`releases/latest` + raw `version.json` with cache-busting timestamp), OkHttp streaming downloader, and FileProvider intent launcher.
            - **Image Engine:** Coil 3.1.0 with LosslessCoverMapper and AndroidX Palette color bloom
            - **Network Layer:** OkHttp 4.12.0 with async coroutines
            - **Database:** Room 2.6.1 SQLite with WAL enabled
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
