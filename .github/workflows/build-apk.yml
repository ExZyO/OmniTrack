name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (optional, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release OmniTrack APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Release Tag
        id: release_info
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.0.0-b${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OmniTrack-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTrack-release
          path: release-output/OmniTrack-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: OmniTrack ${{ steps.release_info.outputs.tag }}
          files: |
            release-output/OmniTrack-release.apk
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
          body: |
            ## 📱 OmniTrack Release (${{ steps.release_info.outputs.tag }})

            ### ✨ What's in this build (Non-Technical Summary)
            - Seamless edge-to-edge UI with ambient dynamic cover glow that bleeds into AMOLED black.
            - Integrated Artwork Waterfall Picker: Discover alternative covers from MangaDex, AniList, and Bangumi, or pick from device gallery.
            - Tactile +1 tracking action on library posters with spring physics.
            - Direct installation ready: signed release APK.

            ### 🔧 Technical Details
            - **Commit:** ${{ github.sha }}
            - **Build Type:** Release (`assembleRelease` with signingConfig)
            - **Image Engine:** Coil 3.1.0 with LosslessCoverMapper and Palette color extraction
            - **Network Layer:** OkHttp 4.12.0 with async coroutines
            - **Database:** Room 2.6.1 SQLite
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
