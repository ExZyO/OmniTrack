name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (optional, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release OmniTrack APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag
        id: release_info
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.0.0-b${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.0-b${{ github.run_number }} --stacktrace
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}

      - name: Prepare Release Artifact & Notes
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk
          COMMIT_SUBJ=$(git log -1 --pretty=%s)
          cat <<EOF > release-output/version.json
          {
            "version": "${{ steps.release_info.outputs.tag }}",
            "versionCode": ${{ github.run_number }},
            "apkUrl": "https://github.com/ExZyO/OmniTrack/releases/download/${{ steps.release_info.outputs.tag }}/OmniTrack-${{ steps.release_info.outputs.tag }}.apk",
            "debugApkUrl": "https://github.com/ExZyO/OmniTrack/releases/download/${{ steps.release_info.outputs.tag }}/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk",
            "releaseNotes": "OmniTrack ${{ steps.release_info.outputs.tag }}: $COMMIT_SUBJ"
          }
          EOF
          cp release-output/version.json version.json

          cat <<EOF > release-output/notes.md
          ## 📱 OmniTrack Release (${{ steps.release_info.outputs.tag }})

          ### ✨ What's in this build
          - **Latest Update:** $COMMIT_SUBJ

          ### 📦 Download Options
          - **Release APK:** \`OmniTrack-${{ steps.release_info.outputs.tag }}.apk\`
          - **Debug APK (for ADB / Wireless Debugging logs):** \`OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk\`

          ### 🔧 Technical Details
          - **Commit:** ${{ github.sha }}
          - **Build Type:** Release & Debug
          - **Engine:** Room SQLite WAL, Coil 3 Lossless Artwork, Fast Dual-Channel Update Stream
          EOF

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniTrack-${{ steps.release_info.outputs.tag }}
          path: release-output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: OmniTrack ${{ steps.release_info.outputs.tag }}
          files: |
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk
            release-output/version.json
          body_path: release-output/notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
