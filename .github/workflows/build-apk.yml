name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (optional, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release OmniTrack APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag
        id: release_info
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v1.0.0-b${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"
          if [ ! -s "${{ runner.temp }}/release.jks" ]; then
            echo "ERROR: Decoded release keystore is empty!"
            exit 1
          fi

      - name: Build Release & Debug APKs
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.0-b${{ github.run_number }} --max-workers=2 --stacktrace
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.0-b${{ github.run_number }} --max-workers=2 --stacktrace
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BANGUMI_CLIENT_ID: ${{ secrets.BANGUMI_CLIENT_ID }}
          BANGUMI_CLIENT_SECRET: ${{ secrets.BANGUMI_CLIENT_SECRET }}
          COMICK_CLIENT_ID: ${{ secrets.COMICK_CLIENT_ID }}

      - name: Prepare Release Artifact & Notes
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk
          RELEASE_SHA256=$(sha256sum "release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk" | awk '{print $1}')
          DEBUG_SHA256=$(sha256sum "release-output/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk" | awk '{print $1}')
          COMMIT_SUBJ=$(git log -1 --pretty=%s)
          SAFE_SUBJ=$(printf '%s' "$COMMIT_SUBJ" | tr '"' "'" | tr -d '\\' | tr '\n' ' ')
          cat <<EOF > release-output/version.json
          {
            "version": "${{ steps.release_info.outputs.tag }}",
            "versionCode": ${{ github.run_number }},
            "apkUrl": "https://github.com/ExZyO/OmniTrack/releases/download/${{ steps.release_info.outputs.tag }}/OmniTrack-${{ steps.release_info.outputs.tag }}.apk",
            "debugApkUrl": "https://github.com/ExZyO/OmniTrack/releases/download/${{ steps.release_info.outputs.tag }}/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk",
            "apkSha256": "$RELEASE_SHA256",
            "debugApkSha256": "$DEBUG_SHA256",
            "releaseNotes": "OmniTrack ${{ steps.release_info.outputs.tag }}: $SAFE_SUBJ"
          }
          EOF
          cp release-output/version.json version.json

          {
            echo "## 📱 OmniTrack Release (${{ steps.release_info.outputs.tag }})"
            echo ""
            if [ -s RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              COMMIT_BODY=$(git log -1 --pretty=%b)
              echo "### ✨ What's in this build"
              echo "- **Latest Update:** $COMMIT_SUBJ"
              if [ -n "$COMMIT_BODY" ]; then
                echo ""
                echo "$COMMIT_BODY"
              fi
            fi
            echo ""
            echo "### 📦 Download Options"
            echo "- **Release APK:** \`OmniTrack-${{ steps.release_info.outputs.tag }}.apk\`"
            echo "- **Debug APK (for ADB / Wireless Debugging logs):** \`OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk\`"
            echo ""
            echo "### 🔐 Verification Checksums (SHA-256)"
            echo "- **Release SHA-256:** \`$RELEASE_SHA256\`"
            echo "- **Debug SHA-256:** \`$DEBUG_SHA256\`"
            echo ""
            echo "### 🔧 Build Metadata"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Build Type:** Release (R8 Minified) & Debug"
            echo "- **Engine:** Room SQLite WAL, Coil 3 32-Bit Artwork + Saliency Focus, Fast Dual-Channel Update Stream"
          } > release-output/notes.md

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniTrack-${{ steps.release_info.outputs.tag }}
          path: release-output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: OmniTrack ${{ steps.release_info.outputs.tag }}
          files: |
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}.apk
            release-output/OmniTrack-${{ steps.release_info.outputs.tag }}-debug.apk
            release-output/version.json
          body_path: release-output/notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
